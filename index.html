<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Daily Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --sam:        #3A7BD5;
  --sam-light:  #E8F1FC;
  --sam-mid:    #A8C8F0;
  --ping:       #D4548A;
  --ping-light: #FCE8F2;
  --ping-mid:   #F0A8C8;
  --soma:       #3AAD72;
  --soma-light: #E8F7EF;
  --soma-mid:   #A8DFC0;
  --bg:         #F2EFE9;
  --card:       #FFFFFF;
  --text:       #1E1C19;
  --muted:      #8A8480;
  --border:     #E2DDD6;
  --radius:     18px;
  --shadow:     0 2px 16px rgba(0,0,0,0.07);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding-bottom: 80px;
}

/* ── HEADER ─────────────────────────────────────────── */
.header {
  padding: 32px 20px 48px;
  background: linear-gradient(150deg,#1A3A6B 0%,#3A7BD5 38%,#D4548A 72%,#3AAD72 100%);
  position: relative; overflow: hidden; text-align: center;
}
.header::after {
  content:''; position:absolute; bottom:-1px; left:0; right:0;
  height:28px; background:var(--bg); border-radius:28px 28px 0 0;
}
.hdr-dots {
  position:absolute; inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,0.13) 1px,transparent 1px);
  background-size:22px 22px;
}
.header h1 {
  font-family:'Nunito',sans-serif; font-size:24px; font-weight:900;
  color:#fff; position:relative;
}
.header .tagline { font-size:13px; color:rgba(255,255,255,0.82); position:relative; margin-top:4px; }
.date-pill {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.22); border:1px solid rgba(255,255,255,0.36);
  border-radius:20px; padding:6px 16px;
  font-size:13px; font-weight:700; color:#fff;
  margin-top:14px; position:relative;
}

/* ── TABS ───────────────────────────────────────────── */
.tabs-wrap { padding:0 14px; margin-top:-4px; }
.tabs {
  display:flex; gap:8px; background:var(--card);
  border-radius:var(--radius); padding:8px; box-shadow:var(--shadow);
}
.tab {
  flex:1; border:none; background:transparent; border-radius:12px;
  padding:10px 6px; cursor:pointer;
  font-family:'Nunito',sans-serif; font-weight:800; font-size:13px;
  transition:all 0.2s; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--muted);
}
.tab .t-emoji { font-size:22px; line-height:1; }
.tab .t-grade {
  font-size:10px; font-weight:700; padding:2px 7px; border-radius:8px;
  color:rgba(0,0,0,0.35); background:var(--border); transition:all 0.2s; white-space:nowrap;
}
.tab.active-sam  { background:var(--sam-light);  color:var(--sam);  }
.tab.active-ping { background:var(--ping-light); color:var(--ping); }
.tab.active-soma { background:var(--soma-light); color:var(--soma); }
.tab.active-sam  .t-grade { background:var(--sam);  color:#fff; }
.tab.active-ping .t-grade { background:var(--ping); color:#fff; }
.tab.active-soma .t-grade { background:var(--soma); color:#fff; }

/* ── PROGRESS STRIP ─────────────────────────────────── */
.progress-strip { display:flex; gap:8px; padding:12px 14px 0; }
.prog-card {
  flex:1; background:var(--card); border-radius:14px;
  padding:10px 12px; box-shadow:0 2px 8px rgba(0,0,0,0.05);
}
.prog-card .pc-name { font-size:11px; font-weight:600; color:var(--muted); }
.prog-bar { height:5px; background:var(--border); border-radius:3px; margin:6px 0 4px; overflow:hidden; }
.prog-fill { height:100%; border-radius:3px; transition:width 0.5s cubic-bezier(.4,0,.2,1); width:0%; }
.pf-sam  { background:var(--sam); }
.pf-ping { background:var(--ping); }
.pf-soma { background:var(--soma); }
.prog-card .pc-pct { font-size:14px; font-weight:800; font-family:'Nunito',sans-serif; }

/* ── CONTENT ─────────────────────────────────────────── */
.content { padding:14px; }
.child-panel { display:none; }
.child-panel.active { display:block; }

/* ── AGE BANNER ──────────────────────────────────────── */
.age-banner {
  margin:0 0 10px; padding:9px 14px;
  background:var(--card); border-radius:12px;
  font-size:12px; font-weight:600; color:var(--muted);
  box-shadow:0 1px 6px rgba(0,0,0,0.05);
  display:flex; gap:6px; align-items:center; flex-wrap:wrap;
}
.age-banner strong { font-weight:800; color:var(--text); }

/* ── SECTION ─────────────────────────────────────────── */
.section {
  background:var(--card); border-radius:var(--radius);
  margin-bottom:12px; overflow:hidden; box-shadow:var(--shadow);
}
.sec-header {
  display:flex; align-items:center; gap:10px;
  padding:14px 16px; cursor:pointer; user-select:none;
  border-left:4px solid transparent; transition:background 0.15s;
}
.sec-header:hover { background:#FAFAFA; }
.sec-icon { font-size:20px; }
.sec-title { font-family:'Nunito',sans-serif; font-weight:800; font-size:14px; flex:1; }
.sec-count {
  font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px;
  background:var(--border); color:var(--muted); transition:all 0.2s;
}
.sec-chevron { font-size:11px; color:var(--muted); transition:transform 0.2s; margin-left:4px; }
.section.collapsed .sec-chevron { transform:rotate(-90deg); }
.section.collapsed .sec-body { display:none; }
.sec-body { border-top:1px solid var(--border); }

/* ── TASK ITEM ───────────────────────────────────────── */
.task-item {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px; border-bottom:1px solid var(--border);
  cursor:pointer; transition:background 0.12s;
  -webkit-tap-highlight-color:transparent;
}
.task-item:last-child { border-bottom:none; }
.task-item:hover { background:#FAFAFA; }
.task-item.done { opacity:0.6; }
.task-item.done .t-label { text-decoration:line-through; color:var(--muted); }
.chk {
  width:26px; height:26px; flex-shrink:0; border-radius:8px;
  border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:900; color:#fff; transition:all 0.18s;
}
.task-item.done .chk { border-color:transparent; }
.t-info { flex:1; min-width:0; }
.t-label { font-size:14px; font-weight:600; line-height:1.3; }
.t-sub   { font-size:11px; color:var(--muted); margin-top:2px; font-weight:500; }
.note-btn {
  width:30px; height:30px; flex-shrink:0; border:none;
  background:var(--bg); border-radius:8px; cursor:pointer;
  font-size:13px; color:var(--muted); transition:all 0.15s;
  display:flex; align-items:center; justify-content:center;
}
.note-btn:hover { background:var(--border); color:var(--text); }

/* colour per child */
.child-panel[data-child="sam"]  .chk { border-color:var(--sam-mid); }
.child-panel[data-child="ping"] .chk { border-color:var(--ping-mid); }
.child-panel[data-child="soma"] .chk { border-color:var(--soma-mid); }
.child-panel[data-child="sam"]  .task-item.done .chk { background:var(--sam); }
.child-panel[data-child="ping"] .task-item.done .chk { background:var(--ping); }
.child-panel[data-child="soma"] .task-item.done .chk { background:var(--soma); }
.child-panel[data-child="sam"]  .sec-header { border-left-color:var(--sam); }
.child-panel[data-child="ping"] .sec-header { border-left-color:var(--ping); }
.child-panel[data-child="soma"] .sec-header { border-left-color:var(--soma); }
.child-panel[data-child="sam"]  .sec-count.all-done { background:var(--sam);  color:#fff; }
.child-panel[data-child="ping"] .sec-count.all-done { background:var(--ping); color:#fff; }
.child-panel[data-child="soma"] .sec-count.all-done { background:var(--soma); color:#fff; }

/* ── NOTE MODAL ──────────────────────────────────────── */
.overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.45); z-index:200;
  align-items:flex-end; justify-content:center;
}
.overlay.open { display:flex; }
.modal {
  background:var(--card); width:100%; max-width:500px;
  border-radius:22px 22px 0 0; padding:24px 20px 28px;
  box-shadow:0 -8px 40px rgba(0,0,0,0.18);
}
.modal h3 { font-family:'Nunito',sans-serif; font-weight:800; font-size:16px; margin-bottom:12px; }
.modal textarea {
  width:100%; height:90px; resize:none;
  border:2px solid var(--border); border-radius:12px;
  padding:12px; font-family:'DM Sans',sans-serif;
  font-size:14px; outline:none; color:var(--text); transition:border-color 0.15s;
}
.modal textarea:focus { border-color:var(--sam); }
.modal-btns { display:flex; gap:10px; margin-top:12px; }
.mbtn {
  flex:1; padding:13px; border:none; border-radius:12px;
  font-family:'Nunito',sans-serif; font-weight:800; font-size:14px;
  cursor:pointer; transition:opacity 0.15s;
}
.mbtn:hover { opacity:0.85; }
.mbtn-cancel { background:var(--bg); color:var(--muted); }
.mbtn-save   { background:var(--sam); color:#fff; }

/* ── SETTINGS ────────────────────────────────────────── */
.settings-toggle {
  display:block; margin:10px 14px 0; background:none; border:none;
  cursor:pointer; font-size:12px; color:var(--muted);
  font-family:'DM Sans',sans-serif; font-weight:500;
  text-decoration:underline; text-align:left; padding:4px 0;
}
.settings-card {
  display:none; margin:10px 14px 0; background:var(--card);
  border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);
}
.settings-card.open { display:block; }
.settings-card h4 { font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; color:var(--muted); margin-bottom:12px; }
.s-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.s-row label { font-size:12px; font-weight:600; color:var(--muted); width:85px; flex-shrink:0; }
.s-row input {
  flex:1; padding:9px 12px; border:1.5px solid var(--border);
  border-radius:10px; font-family:'DM Sans',sans-serif;
  font-size:13px; outline:none; color:var(--text); transition:border-color 0.15s;
}
.s-row input:focus { border-color:var(--sam); }

/* ── SYNC BAR ────────────────────────────────────────── */
.sync-bar {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--card); border-top:1px solid var(--border);
  padding:12px 16px; display:flex; gap:8px; align-items:center;
  box-shadow:0 -4px 20px rgba(0,0,0,0.07); z-index:100;
}
.sync-status { flex:1; font-size:12px; font-weight:600; color:var(--muted); }
.sync-status.syncing { color:var(--ping); }
.sync-status.ok      { color:var(--soma); }
.sync-status.err     { color:#D94040; }
.sbtn {
  padding:10px 16px; border:none; border-radius:10px;
  font-family:'Nunito',sans-serif; font-weight:800; font-size:13px;
  cursor:pointer; transition:opacity 0.2s;
}
.sbtn:hover { opacity:0.85; }
.sbtn:disabled { opacity:0.4; cursor:default; }
.sbtn-reset { background:var(--bg); color:var(--muted); border:1px solid var(--border); }
.sbtn-sync  { background:linear-gradient(130deg,var(--sam),var(--soma)); color:#fff; }
</style>
</head>
<body>

<div class="header">
  <div class="hdr-dots"></div>
  <h1>🌟 Family Daily Checklist</h1>
  <div class="tagline">Sam · PingPing · Soma</div>
  <div class="date-pill">📅 <span id="todayLabel">—</span></div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab" id="tab-sam"  onclick="switchChild('sam')">
      <span class="t-emoji">👦</span>
      <span class="t-name">Sam</span>
      <span class="t-grade" id="grade-sam">—</span>
    </button>
    <button class="tab" id="tab-ping" onclick="switchChild('ping')">
      <span class="t-emoji">👧</span>
      <span class="t-name">PingPing</span>
      <span class="t-grade" id="grade-ping">—</span>
    </button>
    <button class="tab" id="tab-soma" onclick="switchChild('soma')">
      <span class="t-emoji" id="emoji-soma">👶</span>
      <span class="t-name">Soma</span>
      <span class="t-grade" id="grade-soma">—</span>
    </button>
  </div>
</div>

<div class="progress-strip">
  <div class="prog-card">
    <div class="pc-name">Sam</div>
    <div class="prog-bar"><div class="prog-fill pf-sam" id="pf-sam"></div></div>
    <div class="pc-pct" id="pp-sam" style="color:var(--sam)">0%</div>
  </div>
  <div class="prog-card">
    <div class="pc-name">PingPing</div>
    <div class="prog-bar"><div class="prog-fill pf-ping" id="pf-ping"></div></div>
    <div class="pc-pct" id="pp-ping" style="color:var(--ping)">0%</div>
  </div>
  <div class="prog-card">
    <div class="pc-name">Soma</div>
    <div class="prog-bar"><div class="prog-fill pf-soma" id="pf-soma"></div></div>
    <div class="pc-pct" id="pp-soma" style="color:var(--soma)">0%</div>
  </div>
</div>

<button class="settings-toggle"
  onclick="document.getElementById('settingsCard').classList.toggle('open')">
  ⚙️ Google Sheets Settings
</button>
<div class="settings-card" id="settingsCard">
  <h4>Google Apps Script Web App URL</h4>
  <div class="s-row">
    <label>Script URL</label>
    <input id="gasUrl" type="text" placeholder="https://script.google.com/macros/s/…/exec">
  </div>
  <div class="s-row">
    <label>Sheet Name</label>
    <input id="sheetName" type="text" value="ChildChecklist">
  </div>
</div>

<div class="content">
  <div class="child-panel" id="panel-sam"  data-child="sam"></div>
  <div class="child-panel" id="panel-ping" data-child="ping"></div>
  <div class="child-panel" id="panel-soma" data-child="soma"></div>
</div>

<div class="overlay" id="noteOverlay">
  <div class="modal">
    <h3 id="noteTitle">📝 Note</h3>
    <textarea id="noteText" placeholder="Add a note for this task…"></textarea>
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="closeNote()">Cancel</button>
      <button class="mbtn mbtn-save"   onclick="saveNote()">Save</button>
    </div>
  </div>
</div>

<div class="sync-bar">
  <div class="sync-status" id="syncStatus">Ready to sync</div>
  <button class="sbtn sbtn-reset" onclick="resetDay()">↺ Reset</button>
  <button class="sbtn sbtn-sync" id="syncBtn" onclick="syncSheets()">☁ Sync</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  CHILD REGISTRY
//  gradeAnchor2024: grade number in school year 2024-25
//    Grade 1 = 1, Grade 2 = 2, KG Upper = 0, KG Intermediate = -1,
//    Nursery = -2, Infant (not in school) = -99
// ═══════════════════════════════════════════════════════════════════
const KIDS = {
  sam:  { name:'Sam',      dob:'2019-12-06', sex:'M', gradeAnchor2024: 1  },
  ping: { name:'PingPing', dob:'2021-09-06', sex:'F', gradeAnchor2024: -1 },
  soma: { name:'Soma',     dob:'2024-06-24', sex:'F', gradeAnchor2024: -99},
};

// ═══════════════════════════════════════════════════════════════════
//  SCHOOL YEAR & STAGE CALCULATION
//  Cambodia school year starts in October.
//  Grade advances each school year (Oct–Sep cycle).
// ═══════════════════════════════════════════════════════════════════
function currentSchoolYear() {
  const d = new Date();
  // If month >= October (index 9), school year = this year
  return d.getMonth() >= 9 ? d.getFullYear() : d.getFullYear() - 1;
}

function calcAge(dob) {
  const b = new Date(dob), t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() ||
     (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) a--;
  return a;
}

// Returns { label, key } for the current school year
function getStage(child) {
  const kid = KIDS[child];
  const sy  = currentSchoolYear();
  const g   = kid.gradeAnchor2024 + (sy - 2024); // advance 1 per school year

  if (g <= -3)  return { label:'Infant/Toddler',   key:'infant'  };
  if (g === -2) return { label:'Nursery',           key:'nursery' };
  if (g === -1) return { label:'KG Intermediate',   key:'kg_mid'  };
  if (g === 0)  return { label:'KG Upper',          key:'kg_up'   };
  const gr = Math.min(g, 12);
  return { label:'Grade ' + gr, key:'gr' + gr };
}

// ═══════════════════════════════════════════════════════════════════
//  TASK CATALOGUE  — one set of sections per stage key
// ═══════════════════════════════════════════════════════════════════
function buildSections(stageKey) {

  // ── INFANT / TODDLER ──────────────────────────────────────────
  if (stageKey === 'infant') return [
    { id:'morn', icon:'🌅', title:'Morning Care', tasks:[
      {id:'diaper1',   label:'Diaper check & change',            sub:''},
      {id:'feed1',     label:'Morning milk / breastfeed',         sub:''},
      {id:'bath',      label:'Morning bath or wipe-down',         sub:''},
      {id:'dress',     label:'Dress for the day',                 sub:''},
      {id:'tummy',     label:'Tummy time / floor play',           sub:'15–20 min'},
    ]},
    { id:'day', icon:'☀️', title:'Daytime Routine', tasks:[
      {id:'feed2',     label:'Mid-morning feeding',               sub:''},
      {id:'nap1',      label:'Morning nap',                       sub:'1–2 hours'},
      {id:'lunch',     label:'Solid foods / puree lunch',         sub:'Age-appropriate'},
      {id:'play',      label:'Sensory play & talking',            sub:'Sing, read, name objects'},
      {id:'nap2',      label:'Afternoon nap',                     sub:'1–2 hours'},
    ]},
    { id:'health', icon:'💊', title:'Health & Development', tasks:[
      {id:'vit',       label:'Vitamins / drops (if prescribed)',  sub:''},
      {id:'diaper2',   label:'Diaper changes tracked',            sub:'Note any rash or concerns'},
      {id:'motor',     label:'Motor skill practice',              sub:'Crawling, standing, walking'},
      {id:'talk',      label:'Verbal stimulation',                sub:'Talk, name objects, respond to sounds'},
    ]},
    { id:'eve', icon:'🌙', title:'Evening & Bedtime', tasks:[
      {id:'bath2',     label:'Evening bath',                      sub:'Warm, calm routine'},
      {id:'feed3',     label:'Evening feeding',                   sub:''},
      {id:'diaper3',   label:'Clean diaper before sleep',         sub:''},
      {id:'bed',       label:'Settle for sleep',                  sub:'Dim lights, quiet by 7:30 PM'},
    ]},
  ];

  // ── NURSERY (age 3) ───────────────────────────────────────────
  if (stageKey === 'nursery') return [
    { id:'morn', icon:'🌅', title:'Morning Routine', tasks:[
      {id:'wake',      label:'Wake up on time',                   sub:'6:30–7:00 AM'},
      {id:'toilet',    label:'Use toilet / potty',                sub:'With help as needed'},
      {id:'brush',     label:'Brush teeth',                       sub:'With parent help'},
      {id:'bath',      label:'Wash face / bathe',                 sub:''},
      {id:'dress',     label:'Get dressed',                       sub:'Practice putting on clothes'},
      {id:'breakfast', label:'Eat breakfast',                     sub:'Finish main portion'},
    ]},
    { id:'learn', icon:'🎨', title:'Play & Learning', tasks:[
      {id:'craft',     label:'Drawing or colouring',              sub:'15–20 min'},
      {id:'story',     label:'Story time with parent',            sub:'1 book — talk about pictures'},
      {id:'play',      label:'Active outdoor play',               sub:''},
      {id:'social',    label:'Play with siblings / friends',      sub:''},
    ]},
    { id:'aft', icon:'☀️', title:'Afternoon', tasks:[
      {id:'nap',       label:'Nap or quiet rest',                 sub:'45–60 min'},
      {id:'snack',     label:'Healthy snack',                     sub:''},
      {id:'screen',    label:'Screen time (limited)',             sub:'Max 45 min — educational only'},
    ]},
    { id:'eve', icon:'🌙', title:'Evening Routine', tasks:[
      {id:'dinner',    label:'Eat dinner together',               sub:''},
      {id:'bath2',     label:'Bathe',                             sub:''},
      {id:'brush2',    label:'Brush teeth — night',               sub:'2 min with parent'},
      {id:'story2',    label:'Bedtime story',                     sub:'1 book before lights out'},
      {id:'bed',       label:'In bed / lights out',               sub:'8:00 PM'},
    ]},
  ];

  // ── KG INTERMEDIATE (age ~4, gradeAnchor = -1) ────────────────
  if (stageKey === 'kg_mid') return [
    { id:'morn', icon:'🌅', title:'Morning Routine', tasks:[
      {id:'wake',      label:'Wake up on time',                   sub:'6:30 AM'},
      {id:'toilet',    label:'Use toilet',                        sub:'With guidance'},
      {id:'brush',     label:'Brush teeth',                       sub:'With parent help'},
      {id:'bath',      label:'Bathe / wash face',                 sub:''},
      {id:'dress',     label:'Get dressed',                       sub:'With some help'},
      {id:'breakfast', label:'Eat breakfast',                     sub:'Finish full portion'},
      {id:'bag',       label:'School bag ready',                  sub:'Snack, water, book'},
    ]},
    { id:'learn', icon:'🎒', title:'Learning Activities', tasks:[
      {id:'abc',       label:'Recognise & trace letters A–Z',     sub:''},
      {id:'num',       label:'Count and recognise 1–10',          sub:'Use fingers and objects'},
      {id:'story',     label:'Reading time with parent',          sub:'1 book — take turns pointing'},
      {id:'craft',     label:'Creative activity',                 sub:'Drawing, colouring, crafts'},
      {id:'share',     label:'Tell parents about school today',   sub:'Encourage full sentences'},
    ]},
    { id:'aft', icon:'☀️', title:'Afternoon', tasks:[
      {id:'snack',     label:'Healthy after-school snack',        sub:''},
      {id:'rest',      label:'Rest or nap',                       sub:'30–45 min'},
      {id:'play',      label:'Active / outdoor play',             sub:''},

// ═══════════════════════════════════════════════════════════════════
//  RUNTIME STATE
// ═══════════════════════════════════════════════════════════════════
const TODAY_STR = new Date().toISOString().split('T')[0];
const STORE_KEY = 'fam_v4_' + TODAY_STR;

let SECTIONS    = {};   // { child: [section, …] }
let STATE       = {};   // { child: { taskId: { done, note } } }
let activeChild = 'sam';
let noteTarget  = null;

function initSections() {
  for (const child of Object.keys(KIDS)) {
    const { key } = getStage(child);
    SECTIONS[child] = buildSections(key);
  }
}

function initState() {
  const raw = localStorage.getItem(STORE_KEY);
  STATE = raw ? JSON.parse(raw) : {};
  for (const child of Object.keys(KIDS)) {
    if (!STATE[child]) STATE[child] = {};
    for (const sec of SECTIONS[child])
      for (const t of sec.tasks)
        if (!STATE[child][t.id]) STATE[child][t.id] = { done:false, note:'' };
  }
}

function persist() { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); }

// ═══════════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════════
function renderTabs() {
  for (const child of Object.keys(KIDS)) {
    const { label } = getStage(child);
    document.getElementById('grade-' + child).textContent = label;
  }
  // Soma emoji grows up once she's in nursery
  const somaStage = getStage('soma').key;
  document.getElementById('emoji-soma').textContent =
    somaStage === 'infant' ? '👶' : '👧';
}

function renderPanel(child) {
  const panel = document.getElementById('panel-' + child);
  const age   = calcAge(KIDS[child].dob);
  const { label } = getStage(child);

  panel.innerHTML = `<div class="age-banner">
    <strong>${KIDS[child].name}</strong> is <strong>${age} years old</strong>
    &nbsp;·&nbsp; <strong>${label}</strong>
  </div>`;

  for (const sec of SECTIONS[child]) {
    const dn  = sec.tasks.filter(t => STATE[child]?.[t.id]?.done).length;
    const tot = sec.tasks.length;
    const el  = document.createElement('div');
    el.className = 'section';
    el.dataset.secId = sec.id;
    el.innerHTML = `
      <div class="sec-header" onclick="toggleSec(this)">
        <span class="sec-icon">${sec.icon}</span>
        <span class="sec-title">${sec.title}</span>
        <span class="sec-count${dn===tot?' all-done':''}">${dn}/${tot}</span>
        <span class="sec-chevron">▾</span>
      </div>
      <div class="sec-body">${sec.tasks.map(t => taskHTML(child, t)).join('')}</div>`;
    panel.appendChild(el);
  }
}

function taskHTML(child, task) {
  const s = STATE[child]?.[task.id] || { done:false, note:'' };
  const noteSnip = s.note
    ? ' · 📝 ' + s.note.substring(0,38) + (s.note.length>38?'…':'') : '';
  const subLine = (task.sub || noteSnip)
    ? `<div class="t-sub">${task.sub}${noteSnip}</div>` : '';
  // Safe label for attribute (escape single quotes and backticks)
  const safeLabel = task.label.replace(/\\/g,'\\\\').replace(/'/g,'&#39;');
  return `<div class="task-item${s.done?' done':''}" id="ti-${child}-${task.id}"
    onclick="toggleTask('${child}','${task.id}')">
  <div class="chk">${s.done?'✓':''}</div>
  <div class="t-info"><div class="t-label">${task.label}</div>${subLine}</div>
  <button class="note-btn"
    onclick="event.stopPropagation();openNote('${child}','${task.id}','${safeLabel}')"
    title="Add note">✏️</button>
</div>`;
}

function updateProgress(child) {
  let tot=0, dn=0;
  for (const sec of SECTIONS[child])
    for (const t of sec.tasks) { tot++; if (STATE[child]?.[t.id]?.done) dn++; }
  const pct = tot ? Math.round(dn/tot*100) : 0;
  document.getElementById('pf-'+child).style.width = pct+'%';
  document.getElementById('pp-'+child).textContent = pct+'%';
}

function renderAll() {
  for (const child of Object.keys(KIDS)) { renderPanel(child); updateProgress(child); }
}

// ═══════════════════════════════════════════════════════════════════
//  INTERACTIONS
// ═══════════════════════════════════════════════════════════════════
function switchChild(child) {
  activeChild = child;
  for (const c of Object.keys(KIDS)) {
    document.getElementById('tab-'+c).className =
      'tab' + (c===child ? ' active-'+c : '');
    document.getElementById('panel-'+c).classList.toggle('active', c===child);
  }
}

function toggleSec(hdr) { hdr.closest('.section').classList.toggle('collapsed'); }

function toggleTask(child, taskId) {
  const s = STATE[child][taskId];
  s.done = !s.done;
  persist();

  // Patch single row
  const el   = document.getElementById('ti-'+child+'-'+taskId);
  const task = SECTIONS[child].flatMap(s=>s.tasks).find(t=>t.id===taskId);
  if (el && task) el.outerHTML = taskHTML(child, task);

  // Patch section counter
  const panel = document.getElementById('panel-'+child);
  for (const sec of SECTIONS[child]) {
    if (!sec.tasks.find(t=>t.id===taskId)) continue;
    const secEl = panel.querySelector('[data-sec-id="'+sec.id+'"]');
    if (!secEl) continue;
    const dn  = sec.tasks.filter(t=>STATE[child]?.[t.id]?.done).length;
    const tot = sec.tasks.length;
    const cnt = secEl.querySelector('.sec-count');
    cnt.textContent = dn+'/'+tot;
    cnt.className   = 'sec-count'+(dn===tot?' all-done':'');
  }
  updateProgress(child);
}

function openNote(child, taskId, label) {
  noteTarget = { child, taskId };
  // Decode HTML entities in label for display
  const tmp = document.createElement('textarea');
  tmp.innerHTML = label;
  document.getElementById('noteTitle').textContent = '📝 Note — ' + tmp.value;
  document.getElementById('noteText').value = STATE[child]?.[taskId]?.note || '';
  document.getElementById('noteOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('noteText').focus(), 80);
}

function closeNote() {
  document.getElementById('noteOverlay').classList.remove('open');
  noteTarget = null;
}

function saveNote() {
  if (!noteTarget) return;
  const { child, taskId } = noteTarget;
  STATE[child][taskId].note = document.getElementById('noteText').value.trim();
  persist();
  closeNote();
  const el   = document.getElementById('ti-'+child+'-'+taskId);
  const task = SECTIONS[child].flatMap(s=>s.tasks).find(t=>t.id===taskId);
  if (el && task) el.outerHTML = taskHTML(child, task);
}

document.getElementById('noteOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('noteOverlay')) closeNote();
});

function resetDay() {
  if (!confirm('Reset all checkmarks for today?\n(Notes will be kept.)')) return;
  for (const child of Object.keys(KIDS))
    for (const sec of SECTIONS[child])
      for (const t of sec.tasks)
        STATE[child][t.id] = { done:false, note: STATE[child]?.[t.id]?.note || '' };
  persist();
  renderAll();
  setStatus('All tasks reset','');
}

// ═══════════════════════════════════════════════════════════════════
//  GOOGLE SHEETS SYNC
// ═══════════════════════════════════════════════════════════════════
async function syncSheets() {
  const url = document.getElementById('gasUrl').value.trim();
  if (!url) {
    alert('Please enter your Google Apps Script URL in ⚙️ Settings.');
    document.getElementById('settingsCard').classList.add('open');
    return;
  }
  const sheetName = document.getElementById('sheetName').value.trim() || 'ChildChecklist';
  localStorage.setItem('gas_url', url);
  localStorage.setItem('gas_sheet', sheetName);

  setStatus('Syncing…','syncing');
  document.getElementById('syncBtn').disabled = true;

  const now  = new Date().toLocaleString('en-GB');
  const rows = [['Date','Child','Age','School Stage','Section','Task','Done','Note','SyncTime']];

  for (const [child, kid] of Object.entries(KIDS)) {
    const age = calcAge(kid.dob);
    const { label } = getStage(child);
    for (const sec of SECTIONS[child]) {
      for (const t of sec.tasks) {
        const s = STATE[child]?.[t.id] || {};
        rows.push([TODAY_STR, kid.name, age+' yrs', label,
                   sec.title, t.label, s.done?'Yes':'No', s.note||'', now]);
      }
    }
  }

  try {
    await fetch(url, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ sheet: sheetName, rows })
    });
    setStatus('✓ Synced at '+new Date().toLocaleTimeString(),'ok');
  } catch(e) {
    setStatus('✗ Sync failed — check URL','err');
  }
  document.getElementById('syncBtn').disabled = false;
}

function setStatus(msg, cls) {
  const el = document.getElementById('syncStatus');
  el.textContent = msg; el.className = 'sync-status '+cls;
}

    `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;

  const su = localStorage.getItem('gas_url');
  const ss = localStorage.getItem('gas_sheet');
  if (su) document.getElementById('gasUrl').value   = su;
  if (ss) document.getElementById('sheetName').value = ss;

  initSections();   // build age-appropriate task lists
  initState();      // load today's saved state
  renderTabs();     // show correct grade labels
  renderAll();      // draw all panels
